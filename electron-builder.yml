appId: dev.docflow.app
productName: Docflow
copyright: Copyright © 2026 Ali Zabihian

directories:
  buildResources: resources
  output: release

# Only the compiled bundles ship; source and configs stay out of the package.
files:
  - out/**/*
  - package.json

# The PyInstaller-compiled Python sidecar is not a node module, so it is copied
# in verbatim alongside the app rather than bundled into the asar archive.
# At runtime it resolves to <app>/resources/python-dist/ — see src/main/python-bridge/sidecar.ts.
extraResources:
  - from: resources/python-dist
    to: python-dist
    filter:
      - '**/*'
      - '!.gitkeep'
  # Vazirmatn is embedded in the renderer bundle, and the SIL Open Font Licence
  # requires its text to travel with it.
  - from: src/renderer/assets/fonts/OFL.txt
    to: licenses/Vazirmatn-OFL.txt

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  # No `portable` target on purpose. It was built and measured: a portable
  # build unpacks the whole app into %TEMP% on every launch, and at ~600 MB
  # unpacked that took 102 seconds before the window appeared - every time, not
  # just the first. Users would reasonably conclude the app was broken.
  # If the bundle ever slims down enough, revisit it.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # Leave the user's documents alone when they uninstall.
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: resources/icon.png
  category: public.app-category.productivity

linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Office
